services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quizzeira}
      MYSQL_USER: ${MYSQL_USER:-quizzeira}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quizzeira}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - private

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-quizzeira}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-quizzeira-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private
      - dmz

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-quizzeira}:${MYSQL_PASSWORD:-quizzeira}@mysql:3306/${MYSQL_DATABASE:-quizzeira}
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      INTERNAL_API_KEY_CORRECTOR: ${INTERNAL_API_KEY_CORRECTOR:-dev-corrector-key}
      INTERNAL_API_KEY_GENERATOR: ${INTERNAL_API_KEY_GENERATOR:-dev-generator-key}
      INTERNAL_API_KEY_UPDATER: ${INTERNAL_API_KEY_UPDATER:-dev-updater-key}
      INTERNAL_API_KEY_CRAWLER: ${INTERNAL_API_KEY_CRAWLER:-dev-crawler-key}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-quizzeira}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-quizzeira-secret}
      S3_BUCKET: ${S3_BUCKET:-quizzeira}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SEED_DEMO: ${SEED_DEMO:-1}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Password123!}
      DEV_ROOT_EMAIL: ${DEV_ROOT_EMAIL:-root@quizzeira.local}
      DEV_ROOT_PASSWORD: ${DEV_ROOT_PASSWORD:-Password123!}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      # Bind localhost only so /internal is not LAN-exposed in compose.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh /app/apps/api/docker-entrypoint.sh
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - dmz
      - private

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_ORIGIN: ${API_ORIGIN:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api
    networks:
      - dmz

  quiz-corrector:
    build:
      context: .
      dockerfile: apps/quiz-corrector/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY_CORRECTOR:-dev-corrector-key}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-gemini,openai}
      MODEL_RANK_REFRESH_MS: ${MODEL_RANK_REFRESH_MS:-43200000}
      MODEL_RANK_TOP_N: ${MODEL_RANK_TOP_N:-3}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-500}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}
      WORKER_WINDOWS: ${WORKER_WINDOWS:-}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/quiz-corrector:/app/apps/quiz-corrector
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/quiz-corrector/node_modules
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dmz
      - private

  question-updater:
    build:
      context: .
      dockerfile: apps/question-updater/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY_UPDATER:-dev-updater-key}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-gemini,openai}
      MODEL_RANK_REFRESH_MS: ${MODEL_RANK_REFRESH_MS:-43200000}
      MODEL_RANK_TOP_N: ${MODEL_RANK_TOP_N:-3}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-500}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}
      WORKER_WINDOWS: ${WORKER_WINDOWS:-07:00,19:00}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: redis://redis:6379
      QUESTION_UPDATE_GROUNDING: ${QUESTION_UPDATE_GROUNDING:-false}
    volumes:
      - ./apps/question-updater:/app/apps/question-updater
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/question-updater/node_modules
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dmz
      - private

  question-generator:
    build:
      context: .
      dockerfile: apps/question-generator/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY_GENERATOR:-dev-generator-key}
      WORKER_INTERVAL_MS: ${QUESTION_GENERATOR_INTERVAL_MS:-15000}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-gemini,openai}
      MODEL_RANK_REFRESH_MS: ${MODEL_RANK_REFRESH_MS:-43200000}
      MODEL_RANK_TOP_N: ${MODEL_RANK_TOP_N:-3}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-500}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}
      WORKER_WINDOWS: ${WORKER_WINDOWS:-}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/question-generator:/app/apps/question-generator
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/question-generator/node_modules
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dmz
      - private

  exam-crawler:
    build:
      context: .
      dockerfile: apps/exam-crawler/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY_CRAWLER:-dev-crawler-key}
      # 2×/hour; pipeline skips unchanged listings via fingerprints.
      WORKER_INTERVAL_MS: ${EXAM_CRAWLER_INTERVAL_MS:-1800000}
      WORKER_WINDOWS: ${EXAM_CRAWLER_WINDOWS:-}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: redis://redis:6379
      EXAM_CRAWLER_ENABLED: ${EXAM_CRAWLER_ENABLED:-true}
      # Local/MVP default: fixture HTML so catalog fills without live site flakiness.
      EXAM_CRAWLER_FIXTURE_MODE: ${EXAM_CRAWLER_FIXTURE_MODE:-true}
      EXAM_CRAWLER_MAX_SOURCES: ${EXAM_CRAWLER_MAX_SOURCES:-4}
      EXAM_CRAWLER_MAX_OPEN_PER_SOURCE: ${EXAM_CRAWLER_MAX_OPEN_PER_SOURCE:-8}
      EXAM_CRAWLER_MAX_SEARCHES: ${EXAM_CRAWLER_MAX_SEARCHES:-2}
    volumes:
      - ./apps/exam-crawler:/app/apps/exam-crawler
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/exam-crawler/node_modules
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dmz
      - private

volumes:
  mysql_data:
  minio_data:
  redis_data:

networks:
  dmz:
    driver: bridge
  private:
    driver: bridge
    internal: true
