# Local Quizzeira stack.
#
# Single env file: `.env` (hosts are the switch). Primary mode = local apps →
# staging Supabase via SSH tunnel (host.docker.internal:15432). Redis/MinIO
# default to Compose services; point REDIS_URL / S3_* at staging when tunneled.
# Rare fully-local DBs: set DATABASE_* hosts to `postgres` in `.env`.
#
# Internal APIs are never LAN-exposed: only web (5173) and the study API
# (127.0.0.1:3000) publish ports. discovery-api and content-api stay on the
# private network.
#
# Deterministic E2E (§41.3): set LLM_PROVIDER=fixture in .env (see .env.sample).
x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # pgvector image so quizzeira_content can CREATE EXTENSION vector.
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizzeira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizzeira}
      POSTGRES_DB: ${POSTGRES_DB:-quizzeira_discovery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates study/content DBs alongside discovery and enables pgvector.
      - ./scripts/local-postgres-init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizzeira} -d ${POSTGRES_DB:-quizzeira_discovery}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - private

  minio:
    # Docker Hub minio/minio often requires login; Quay is the public mirror.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-quizzeira}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-quizzeira-secret}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private
      - dmz

  # ── Study plane ───────────────────────────────────────────────────────────

  api:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://quizzeira:quizzeira@postgres:5432/quizzeira_study?schema=public}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:-postgresql://quizzeira:quizzeira@postgres:5432/quizzeira_study?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      INTERNAL_API_KEY_CORRECTOR: ${INTERNAL_API_KEY_CORRECTOR:-dev-corrector-key}
      INTERNAL_API_KEY_DISCOVERY: ${INTERNAL_API_KEY_DISCOVERY:-dev-discovery-key}
      INTERNAL_API_KEY_CONTENT: ${INTERNAL_API_KEY_CONTENT:-dev-content-key}
      DISCOVERY_API_URL: http://discovery-api:3010
      CONTENT_API_URL: http://content-api:3020
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-quizzeira}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-quizzeira-secret}
      S3_BUCKET: ${S3_BUCKET:-quizzeira}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      DEV_ROOT_EMAIL: ${DEV_ROOT_EMAIL:-root@quizzeira.local}
      DEV_ROOT_PASSWORD: ${DEV_ROOT_PASSWORD:-Password123!}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      # Bind localhost only so /internal is not LAN-exposed in compose.
      # Host port override: API_HOST_PORT (e.g. 4340 for quizzeira-cursor).
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh /app/apps/api/docker-entrypoint.sh
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - dmz
      - private

  web:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_ORIGIN: ${API_ORIGIN:-http://localhost:3000}
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api
    networks:
      - dmz

  # Concept: Grading
  quiz-corrector:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/quiz-corrector/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY_CORRECTOR:-dev-corrector-key}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      # Quizzeira workers do not use Headroom (Docker cannot reach host :8787
      # reliably; local Headroom also 401s this stack's Gemini key). Opt out
      # explicitly — host Cursor tooling can still use Headroom separately.
      LLM_USE_HEADROOM: "false"
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_BASE_URL: https://api.openai.com/v1
      # §41.3: LLM_PROVIDER=fixture for deterministic E2E (see .env.sample).
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-openai,gemini}
      MODEL_RANK_REFRESH_MS: ${MODEL_RANK_REFRESH_MS:-43200000}
      MODEL_RANK_TOP_N: ${MODEL_RANK_TOP_N:-3}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-500}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}
      WORKER_WINDOWS: ${WORKER_WINDOWS:-}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    volumes:
      - ./apps/quiz-corrector:/app/apps/quiz-corrector
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/quiz-corrector/node_modules
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dmz
      - private

  # ── Discovery plane (Ingestion) ───────────────────────────────────────────

  discovery-api:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/discovery-api/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3010
      DISCOVERY_DATABASE_URL: ${DISCOVERY_DATABASE_URL:-postgresql://quizzeira:quizzeira@postgres:5432/quizzeira_discovery}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      INTERNAL_API_KEY_DISCOVERY: ${INTERNAL_API_KEY_DISCOVERY:-dev-discovery-key}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-quizzeira}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-quizzeira-secret}
      S3_BUCKET: ${S3_BUCKET:-quizzeira}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - ./apps/discovery-api:/app/apps/discovery-api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/discovery-api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3010/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - private
      - dmz

  discovery-crawler:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/discovery-crawler/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The crawler talks to discovery-api, never to the study API.
      INTERNAL_API_URL: http://discovery-api:3010
      INTERNAL_API_KEY: ${INTERNAL_API_KEY_DISCOVERY:-dev-discovery-key}
      # 2×/hour; a pass skips sources whose listing fingerprint is unchanged.
      WORKER_INTERVAL_MS: ${DISCOVERY_CRAWLER_INTERVAL_MS:-1800000}
      WORKER_WINDOWS: ${DISCOVERY_CRAWLER_WINDOWS:-}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISCOVERY_CRAWLER_ENABLED: ${DISCOVERY_CRAWLER_ENABLED:-true}
      DISCOVERY_CRAWLER_FIXTURE_MODE: ${DISCOVERY_CRAWLER_FIXTURE_MODE:-false}
      DISCOVERY_CRAWLER_MAX_SOURCES: ${DISCOVERY_CRAWLER_MAX_SOURCES:-16}
      DISCOVERY_CRAWLER_MAX_OPEN_PER_SOURCE: ${DISCOVERY_CRAWLER_MAX_OPEN_PER_SOURCE:-8}
      DISCOVERY_CRAWLER_MAX_ARTIFACTS: ${DISCOVERY_CRAWLER_MAX_ARTIFACTS:-16}
      DISCOVERY_CRAWLER_MAX_OAB_EDITIONS: ${DISCOVERY_CRAWLER_MAX_OAB_EDITIONS:-3}
      DISCOVERY_CRAWLER_NAV_TIMEOUT_MS: ${DISCOVERY_CRAWLER_NAV_TIMEOUT_MS:-45000}
    volumes:
      - ./apps/discovery-crawler:/app/apps/discovery-crawler
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/discovery-crawler/node_modules
    depends_on:
      discovery-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    shm_size: 1gb
    networks:
      - dmz
      - private

  # Opt-in locally: `docker compose --profile lifecycle up discovery-lifecycle`.
  discovery-lifecycle:
    <<: *host-gateway
    profiles: ["lifecycle"]
    build:
      context: .
      dockerfile: apps/discovery-lifecycle/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3012
      INTERNAL_API_URL: http://discovery-api:3010
      INTERNAL_API_KEY: ${INTERNAL_API_KEY_DISCOVERY:-dev-discovery-key}
      WORKER_INTERVAL_MS: ${DISCOVERY_LIFECYCLE_INTERVAL_MS:-900000}
      WORKER_WINDOWS: ${DISCOVERY_LIFECYCLE_WINDOWS:-}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      DISCOVERY_LIFECYCLE_ENABLED: ${DISCOVERY_LIFECYCLE_ENABLED:-true}
      DISCOVERY_LIFECYCLE_SOFT_ARCHIVE_DAYS: ${DISCOVERY_LIFECYCLE_SOFT_ARCHIVE_DAYS:-30}
      DISCOVERY_LIFECYCLE_HARD_DELETE_DAYS: ${DISCOVERY_LIFECYCLE_HARD_DELETE_DAYS:-90}
      DISCOVERY_LIFECYCLE_DROP_TOMBSTONE: ${DISCOVERY_LIFECYCLE_DROP_TOMBSTONE:-false}
      DISCOVERY_LIFECYCLE_BATCH_SIZE: ${DISCOVERY_LIFECYCLE_BATCH_SIZE:-50}
    volumes:
      - ./apps/discovery-lifecycle:/app/apps/discovery-lifecycle
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/discovery-lifecycle/node_modules
    depends_on:
      discovery-api:
        condition: service_healthy
    networks:
      - private

  # Social → Discovery scout (fixture/stubs; off by default). Never registers
  # social hosts as Sources — proposes outbound file domains via scout API.
  discovery-social-scout:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/discovery-social-scout/Dockerfile.dev
      network: host
    restart: unless-stopped
    profiles:
      - social-scout
    env_file:
      - .env
    environment:
      PORT: 3013
      INTERNAL_API_URL: http://discovery-api:3010
      INTERNAL_API_KEY: ${INTERNAL_API_KEY_DISCOVERY:-dev-discovery-key}
      WORKER_INTERVAL_MS: ${DISCOVERY_SOCIAL_INTERVAL_MS:-3600000}
      WORKER_WINDOWS: ${DISCOVERY_SOCIAL_WINDOWS:-}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      DISCOVERY_SOCIAL_ENABLED: ${DISCOVERY_SOCIAL_ENABLED:-false}
      DISCOVERY_SOCIAL_FIXTURE_MODE: ${DISCOVERY_SOCIAL_FIXTURE_MODE:-true}
      DISCOVERY_SOCIAL_STORE_URL_ARTIFACTS: ${DISCOVERY_SOCIAL_STORE_URL_ARTIFACTS:-false}
      DISCOVERY_SOCIAL_ADAPTERS: ${DISCOVERY_SOCIAL_ADAPTERS:-fixture}
      DISCOVERY_SOCIAL_MAX_POSTS: ${DISCOVERY_SOCIAL_MAX_POSTS:-40}
      DISCOVERY_SOCIAL_MAX_FILES: ${DISCOVERY_SOCIAL_MAX_FILES:-12}
    volumes:
      - ./apps/discovery-social-scout:/app/apps/discovery-social-scout
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/discovery-social-scout/node_modules
    depends_on:
      discovery-api:
        condition: service_healthy
    networks:
      - dmz
      - private

  # ── Content plane (Extraction, Generation, Eval) ──────────────────────────

  doc-processor:
    build:
      context: ./apps/doc-processor
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    ports:
      - "${DOC_PROCESSOR_HOST_PORT:-3030}:3030"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3030/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - private
      - dmz

  content-api:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/content-api/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3020
      CONTENT_DATABASE_URL: ${CONTENT_DATABASE_URL:-postgresql://quizzeira:quizzeira@postgres:5432/quizzeira_content}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      INTERNAL_API_KEY_CONTENT: ${INTERNAL_API_KEY_CONTENT:-dev-content-key}
      CONTENT_EMBEDDING_DIMENSIONS: ${CONTENT_EMBEDDING_DIMENSIONS:-768}
      CONTENT_GEMINI_EMBEDDING_MODEL: ${CONTENT_GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-quizzeira}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-quizzeira-secret}
      S3_BUCKET: ${S3_BUCKET:-quizzeira}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    volumes:
      - ./apps/content-api:/app/apps/content-api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/apps/content-api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3020/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - private
      - dmz

  content-worker:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/content-worker/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DISCOVERY_API_URL: http://discovery-api:3010
      CONTENT_API_URL: http://content-api:3020
      INTERNAL_API_KEY_DISCOVERY: ${INTERNAL_API_KEY_DISCOVERY:-dev-discovery-key}
      INTERNAL_API_KEY_CONTENT: ${INTERNAL_API_KEY_CONTENT:-dev-content-key}
      WORKER_INTERVAL_MS: ${CONTENT_WORKER_INTERVAL_MS:-120000}
      WORKER_WINDOWS: ${CONTENT_WORKER_WINDOWS:-}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      # See quiz-corrector: Quizzeira workers skip Headroom.
      LLM_USE_HEADROOM: "false"
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_BASE_URL: https://api.openai.com/v1
      # §41.3: LLM_PROVIDER=fixture for deterministic E2E (see .env.sample).
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-openai,gemini}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-500}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}
      CONTENT_EMBEDDING_DIMENSIONS: ${CONTENT_EMBEDDING_DIMENSIONS:-768}
      CONTENT_GEMINI_EMBEDDING_MODEL: ${CONTENT_GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      CONTENT_PUBLISHED_TARGET: ${CONTENT_PUBLISHED_TARGET:-40}
      DOC_PROCESSOR_URL: http://doc-processor:3030
    volumes:
      - ./apps/content-worker:/app/apps/content-worker
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/content-worker/node_modules
    depends_on:
      content-api:
        condition: service_healthy
      discovery-api:
        condition: service_healthy
      doc-processor:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dmz
      - private

  # Worker-extraction profiles (§12 slice 2): same image as content-worker,
  # separate failure domain per resource profile. Opt-in shadow services —
  # enable alongside the monolith (`docker compose up content-worker-embedded
  # content-worker-generation`) to compare metrics before switching.
  content-worker-documents:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/content-worker/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTENT_WORKER_PROFILE: documents
      DISCOVERY_API_URL: http://discovery-api:3010
      CONTENT_API_URL: http://content-api:3020
      INTERNAL_API_KEY_DISCOVERY: ${INTERNAL_API_KEY_DISCOVERY:-dev-discovery-key}
      INTERNAL_API_KEY_CONTENT: ${INTERNAL_API_KEY_CONTENT:-dev-content-key}
      WORKER_INTERVAL_MS: ${CONTENT_WORKER_INTERVAL_MS:-120000}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LLM_USE_HEADROOM: "false"
      DOC_PROCESSOR_URL: http://doc-processor:3030
      SERVICE_NAME: quizzeira-contentworker-documents
    volumes:
      - ./apps/content-worker:/app/apps/content-worker
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/content-worker/node_modules
    depends_on:
      content-api:
        condition: service_healthy
      discovery-api:
        condition: service_healthy
      doc-processor:
        condition: service_healthy
    profiles: ["shadow"]
    networks:
      - dmz
      - private

  content-worker-embeddings:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/content-worker/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTENT_WORKER_PROFILE: embeddings
      CONTENT_API_URL: http://content-api:3020
      INTERNAL_API_KEY_CONTENT: ${INTERNAL_API_KEY_CONTENT:-dev-content-key}
      WORKER_INTERVAL_MS: ${CONTENT_WORKER_INTERVAL_MS:-120000}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LLM_USE_HEADROOM: "false"
      SERVICE_NAME: quizzeira-contentworker-embeddings
    volumes:
      - ./apps/content-worker:/app/apps/content-worker
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/content-worker/node_modules
    depends_on:
      content-api:
        condition: service_healthy
    profiles: ["shadow"]
    networks:
      - dmz
      - private

  content-worker-generation:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/content-worker/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTENT_WORKER_PROFILE: generation
      CONTENT_API_URL: http://content-api:3020
      INTERNAL_API_KEY_CONTENT: ${INTERNAL_API_KEY_CONTENT:-dev-content-key}
      WORKER_INTERVAL_MS: ${CONTENT_WORKER_INTERVAL_MS:-120000}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LLM_USE_HEADROOM: "false"
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_BASE_URL: https://api.openai.com/v1
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-openai,gemini}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-500}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}
      SERVICE_NAME: quizzeira-contentworker-generation
    volumes:
      - ./apps/content-worker:/app/apps/content-worker
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/content-worker/node_modules
    depends_on:
      content-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["shadow"]
    networks:
      - dmz
      - private

  # Concept: Eval — the only service that may publish a question.
  content-quality:
    <<: *host-gateway
    build:
      context: .
      dockerfile: apps/content-quality/Dockerfile.dev
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTENT_API_URL: http://content-api:3020
      INTERNAL_API_KEY_CONTENT: ${INTERNAL_API_KEY_CONTENT:-dev-content-key}
      WORKER_INTERVAL_MS: ${CONTENT_QUALITY_INTERVAL_MS:-60000}
      WORKER_WINDOWS: ${CONTENT_QUALITY_WINDOWS:-}
      WORKER_TZ: ${WORKER_TZ:-UTC}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      # See quiz-corrector: Quizzeira workers skip Headroom.
      LLM_USE_HEADROOM: "false"
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-nano}
      OPENAI_BASE_URL: https://api.openai.com/v1
      # §41.3: LLM_PROVIDER=fixture for deterministic E2E (see .env.sample).
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-openai,gemini}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-20}
      LLM_DAILY_BUDGET: ${LLM_DAILY_BUDGET:-500}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}
      CONTENT_QUALITY_ENABLED: ${CONTENT_QUALITY_ENABLED:-true}
      # Past-exam extraction can publish without LLM when judge/Headroom is down.
      CONTENT_QUALITY_PUBLISH_EXTRACTION_WITHOUT_JUDGE: "true"
      CONTENT_QUALITY_PUBLISH_THRESHOLD: ${CONTENT_QUALITY_PUBLISH_THRESHOLD:-0.8}
      CONTENT_QUALITY_FAIL_THRESHOLD: ${CONTENT_QUALITY_FAIL_THRESHOLD:-0.5}
    volumes:
      - ./apps/content-quality:/app/apps/content-quality
      - ./packages/shared:/app/packages/shared
      - ./packages/worker-kit:/app/packages/worker-kit
      - /app/node_modules
      - /app/apps/content-quality/node_modules
    depends_on:
      content-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dmz
      - private

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  dmz:
    driver: bridge
  private:
    driver: bridge
    internal: true
