name: No listing trivia

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  listing-trivia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w @quizzeira/shared
      - run: npm run test:quality
      - run: npm run test:shared
      - name: Ensure listing-trivia regression exists
        run: test -f apps/content-quality/src/regression/listing-trivia.spec.ts
