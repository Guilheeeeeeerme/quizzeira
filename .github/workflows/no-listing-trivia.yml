name: no-listing-trivia
on:
  pull_request:
  push:
    branches: [main, benchmark/**]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w @quizzeira/shared
      - run: node --import tsx --test apps/content-quality/src/regression/listing-trivia.spec.ts
      - run: node --import tsx --test packages/shared/src/curriculum/metadata.spec.ts
